name: Cloud Build & Auto-Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Build Target'
        required: true
        default: 'windows-only'
        type: choice
        options:
          - 'windows-only'
          - 'all'
          - 'linux-only'
          - 'android-only'
      tag_name:
        description: 'Release Tag (e.g. v269.11.0)'
        required: true
        default: 'v269.11.0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

jobs:
  build-android:
    name: Build Android APK
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'android-only' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev zip unzip ccache lld

      - name: Setup Android Environment
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip setuptools
          pip install buildozer cython==0.29.37

      - name: Build APK with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-apk
          path: bin/*.apk

  build-pc-linux:
    name: Build Linux PC Binary
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'linux-only' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UPX & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y upx patchelf

      - name: Install Dependencies
        run: pip install nuitka PySide6 requests pyjnius pillow

      - name: Compile Linux Binary (Portable Onefile)
        run: |
          python3 -m nuitka \
            --standalone \
            --onefile \
            --assume-yes-for-downloads \
            --enable-plugin=pyside6 \
            --enable-plugin=upx \
            --upx-binary=$(which upx) \
            --noinclude-qt-translations \
            --include-data-file=wallpaper.jpg=wallpaper.jpg \
            --include-data-file=icon.png=icon.png \
            --nofollow-import-to=tkinter,test,unittest,pydoc,doctest,email,html,http,xml,distutils,setuptools,numpy,scipy,matplotlib,curses,PySide6.QtQml,PySide6.QtQuick,PySide6.QtWebEngineCore,PySide6.QtWebEngineWidgets,PySide6.Qt3DCore,PySide6.QtPdf,PySide6.QtSql,PySide6.QtMultimedia,PySide6.QtTest,PySide6.QtSensors,PySide6.QtPositioning,PySide6.QtBluetooth,PySide6.QtDesigner \
            --linux-icon=icon.png \
            --output-filename=CelSuite-Linux-Portable.bin \
            main.py

      - name: Compile Linux Binary (Standalone Folder)
        run: |
          python3 -m nuitka \
            --standalone \
            --assume-yes-for-downloads \
            --enable-plugin=pyside6 \
            --enable-plugin=upx \
            --upx-binary=$(which upx) \
            --noinclude-qt-translations \
            --include-data-file=wallpaper.jpg=wallpaper.jpg \
            --include-data-file=icon.png=icon.png \
            --nofollow-import-to=tkinter,test,unittest,pydoc,doctest,email,html,http,xml,distutils,setuptools,numpy,scipy,matplotlib,curses,PySide6.QtQml,PySide6.QtQuick,PySide6.QtWebEngineCore,PySide6.QtWebEngineWidgets,PySide6.Qt3DCore,PySide6.QtPdf,PySide6.QtSql,PySide6.QtMultimedia,PySide6.QtTest,PySide6.QtSensors,PySide6.QtPositioning,PySide6.QtBluetooth,PySide6.QtDesigner \
            --linux-icon=icon.png \
            --output-dir=standalone_build \
            main.py
          zip -r CelSuite-Linux-Standalone.zip standalone_build/main.dist/

      - name: Upload Linux Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: |
            CelSuite-Linux-Portable.bin
            CelSuite-Linux-Standalone.zip

  build-pc-windows:
    name: Build Windows PC Binary
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'windows-only' }}
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install nuitka PySide6 requests pillow

      - name: Ensure icon.ico exists
        shell: pwsh
        run: |
          python -c "from PIL import Image; img = Image.open('icon.webp'); img.save('icon.png', 'PNG'); img = Image.open('icon.png'); img.save('icon.ico', format='ICO', sizes=[(16,16), (32,32), (48,48), (64,64), (128,128), (256,256)])"

      - name: Compile Windows Binary (Portable Onefile)
        shell: pwsh
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --assume-yes-for-downloads `
            --enable-plugin=pyside6 `
            --windows-console-mode=disable `
            --include-data-file=wallpaper.jpg=wallpaper.jpg `
            --include-data-file=icon.png=icon.png `
            --windows-icon-from-ico=icon.ico `
            --noinclude-qt-translations `
            --nofollow-import-to=tkinter,test,unittest,pydoc,doctest,email,html,http,xml,distutils,setuptools,numpy,scipy,matplotlib,curses,PySide6.QtQml,PySide6.QtQuick,PySide6.QtWebEngineCore,PySide6.QtWebEngineWidgets,PySide6.Qt3DCore,PySide6.QtPdf,PySide6.QtSql,PySide6.QtMultimedia,PySide6.QtTest,PySide6.QtSensors,PySide6.QtPositioning,PySide6.QtBluetooth,PySide6.QtDesigner `
            --output-filename=CelSuite-Windows-Portable.exe `
            main.py

      - name: Compile Windows Binary (Standalone Folder)
        shell: pwsh
        run: |
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --enable-plugin=pyside6 `
            --windows-console-mode=disable `
            --include-data-file=wallpaper.jpg=wallpaper.jpg `
            --include-data-file=icon.png=icon.png `
            --windows-icon-from-ico=icon.ico `
            --noinclude-qt-translations `
            --nofollow-import-to=tkinter,test,unittest,pydoc,doctest,email,html,http,xml,distutils,setuptools,numpy,scipy,matplotlib,curses,PySide6.QtQml,PySide6.QtQuick,PySide6.QtWebEngineCore,PySide6.QtWebEngineWidgets,PySide6.Qt3DCore,PySide6.QtPdf,PySide6.QtSql,PySide6.QtMultimedia,PySide6.QtTest,PySide6.QtSensors,PySide6.QtPositioning,PySide6.QtBluetooth,PySide6.QtDesigner `
            --output-dir=standalone_win `
            main.py
          Compress-Archive -Path standalone_win\main.dist\* -DestinationPath CelSuite-Windows-Standalone.zip

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: |
            CelSuite-Windows-Portable.exe
            CelSuite-Windows-Standalone.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-pc-linux, build-pc-windows]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: ./release-assets

      - name: Display downloaded assets
        run: ls -la -R ./release-assets || true

      - name: Create GitHub Release & Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name != '' && github.event.inputs.tag_name || github.ref_name }}
          name: CelSuite - Scrcpy Heartbeat ${{ github.event.inputs.tag_name != '' && github.event.inputs.tag_name || github.ref_name }}
          make_latest: true
          fail_on_unmatched_files: false
          body: |
            <div align="center">
            <img src="https://github.com/HenryCarm/CelSuite_Scrcpy-Heartbeat/raw/master/banner_green.webp" alt="CelSuite Banner" width="100%" style="border-radius: 12px; max-width: 850px;" />

            # CelSuite — Scrcpy Heartbeat ${{ github.event.inputs.tag_name != '' && github.event.inputs.tag_name || github.ref_name }}

            *Seamless, zero-friction wireless Android mirroring, hardware telemetry, bi-directional clipboard sync & high-speed file transfers.*

            </div>

            ---

            ### 📦 Downloads & Platform Binaries

            | Platform | Package / Executable | Description |
            | :--- | :--- | :--- |
            | 📱 **Android** | `*.apk` | Mobile client with Quick Settings Tile & clipboard bridge |
            | 🪟 **Windows (Portable)** | `CelSuite-Windows-Portable.exe` | Single-file instant executable (no installation needed) |
            | 🪟 **Windows (Standalone)** | `CelSuite-Windows-Standalone.zip` | Fast-launch extracted folder distribution |
            | 🐧 **Linux (Portable)** | `CelSuite-Linux-Portable.bin` | Single-file executable (`chmod +x` and launch) |
            | 🐧 **Linux (Standalone)** | `CelSuite-Linux-Standalone.zip` | Extracted distribution with all native dependencies |

            ---

            ### ✨ What's New in This Release:
            - 🏷️ **Official Rebrand to CelSuite:** Full ecosystem rename to `HenryJayZ.CelSuite.ScrcpyHeartbeat`.
            - 🎛️ **Quick Settings Tile:** Toggle wireless mirroring directly from your Samsung One UI / Android Quick Panel!
            - 📊 **Live Hardware Dashboard:** Real-time battery %, temperature, resolution, and ping without polling lag.
            - 📋 **Bi-directional Clipboard Sync:** One-tap clipboard transfer between Phone and PC.
            - 🪟 **Windows 10/11 Native Support:** Silent ADB execution (`CREATE_NO_WINDOW`), automatic platform-tools detection, and private network discovery.
            - ⚡ **Zero-Auth Build Monitor:** Seamless artifact inspection and auto-ADB installation.

            ---
            *Built automatically with ❤️ by GitHub Actions Cloud CI/CD.*
          files: |
            ./release-assets/android-apk/*.apk
            ./release-assets/linux-binary/*
            ./release-assets/windows-binary/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}